<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Chrome Wired Earphone</title>
<style>
:root{--accent:#1f6feb;--bg:#f5f7fa;--card:#fff;--text:#1b1f24;--muted:#6b7280;--line:#e5e7eb}
*{box-sizing:border-box}
body{margin:0;font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;background:var(--bg);color:var(--text);line-height:1.5}
.banner{background:var(--accent);color:#fff;text-align:center;padding:8px 12px;font-size:14px}
header{background:var(--card);border-bottom:1px solid var(--line);padding:14px 20px;display:flex;justify-content:space-between;align-items:center}
header h1{font-size:18px;margin:0}
.wrap{max-width:1000px;margin:0 auto;padding:20px 16px}
.hero{display:grid;grid-template-columns:1fr 1fr;gap:28px;background:var(--card);border-radius:16px;padding:24px;box-shadow:0 2px 12px rgba(0,0,0,.05)}
@media(max-width:720px){.hero{grid-template-columns:1fr;padding:16px}}
.imgbox{background:linear-gradient(145deg,#eef1f5,#dfe4ea);border-radius:14px;display:flex;align-items:center;justify-content:center;min-height:280px;overflow:hidden}
.imgbox img{width:100%;height:100%;object-fit:cover;max-height:420px}
h2{margin:0 0 6px;font-size:26px}
.tag{color:var(--muted);margin:0 0 14px}
.price{font-size:30px;font-weight:700}
.mrp{color:var(--muted);text-decoration:line-through;margin-left:8px;font-size:18px}
.off{color:#15803d;font-weight:600;margin-left:8px}
.badge{display:inline-block;padding:5px 12px;border-radius:999px;font-size:14px;font-weight:600;margin:12px 0}
.in{background:#dcfce7;color:#166534}.low{background:#fef3c7;color:#92400e}.out{background:#fee2e2;color:#991b1b}
.qty{display:flex;align-items:center;gap:10px;margin:8px 0 16px}
.qty button{width:36px;height:36px;border-radius:8px;border:1px solid var(--line);background:#fff;font-size:18px;cursor:pointer}
.qty span{min-width:28px;text-align:center;font-weight:600}
.btn{display:inline-block;border:0;border-radius:10px;padding:12px 20px;font-size:16px;font-weight:600;cursor:pointer;text-decoration:none;color:#fff;background:var(--accent)}
.btn.wa{background:#16a34a}.btn.ghost{background:#fff;color:var(--accent);border:1px solid var(--accent)}
.btn:disabled{background:#9ca3af;cursor:not-allowed}
.row{display:flex;gap:10px;flex-wrap:wrap}
.sec{background:var(--card);border-radius:16px;padding:20px 24px;margin-top:18px;box-shadow:0 2px 12px rgba(0,0,0,.05)}
.sec h3{margin:0 0 12px}
ul.feat{margin:0;padding-left:20px}
table{width:100%;border-collapse:collapse}
td{padding:9px 6px;border-bottom:1px solid var(--line);vertical-align:top}
td:first-child{color:var(--muted);width:40%}
.info{display:grid;grid-template-columns:1fr 1fr;gap:14px}
@media(max-width:720px){.info{grid-template-columns:1fr}}
footer{text-align:center;color:var(--muted);font-size:13px;padding:26px 12px}
footer a{color:var(--muted);cursor:pointer;text-decoration:underline}
.closed{background:#fee2e2;color:#991b1b;padding:10px;border-radius:10px;margin-bottom:12px;font-weight:600}

/* owner panel */
#adminModal{display:none;position:fixed;inset:0;background:rgba(0,0,0,.55);z-index:50;overflow:auto;padding:16px}
#adminModal.open{display:block}
.panel{background:#fff;max-width:640px;margin:0 auto;border-radius:16px;padding:20px}
.panel h3{margin-top:0;display:flex;justify-content:space-between;align-items:center}
.panel label{display:block;font-size:13px;font-weight:600;margin:12px 0 4px}
.panel input[type=text],.panel input[type=number],.panel input[type=password],.panel textarea{width:100%;padding:10px;border:1px solid #cbd5e1;border-radius:8px;font:inherit}
.panel textarea{min-height:90px}
.panel .grp{border-top:1px solid var(--line);margin-top:16px;padding-top:4px}
.panel .grp h4{margin:12px 0 0}
.panel small{color:var(--muted);display:block;margin-top:3px}
.note{background:#eff6ff;border:1px solid #bfdbfe;border-radius:10px;padding:10px 12px;font-size:13px;margin:12px 0}
.stockbtns{display:flex;gap:8px;margin-top:8px;flex-wrap:wrap}
.stockbtns button{padding:8px 12px;border-radius:8px;border:1px solid #cbd5e1;background:#f8fafc;cursor:pointer}
.sticky{position:sticky;bottom:-20px;background:#fff;padding:12px 0;margin-top:14px;border-top:1px solid var(--line);display:flex;gap:8px;flex-wrap:wrap}
.toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:#111;color:#fff;padding:10px 18px;border-radius:10px;z-index:99;display:none}
</style>
</head>
<body>

<div id="banner" class="banner" style="display:none"></div>
<header><h1 id="shopName"></h1><span id="shopCity" style="color:var(--muted);font-size:14px"></span></header>

<div class="wrap">
  <div id="closedMsg"></div>
  <section class="hero">
    <div class="imgbox"><img id="pImg" alt="Product image"></div>
    <div>
      <h2 id="pName"></h2>
      <p class="tag" id="pTag"></p>
      <div><span class="price" id="pPrice"></span><span class="mrp" id="pMrp"></span><span class="off" id="pOff"></span></div>
      <div id="stockBadge" class="badge"></div>
      <div class="qty"><span style="color:var(--muted)">Quantity</span>
        <button id="minus" type="button">−</button><span id="qtyVal">1</span><button id="plus" type="button">+</button>
      </div>
      <div class="row">
        <a id="orderBtn" class="btn wa" target="_blank" rel="noopener">Order on WhatsApp</a>
        <a id="callBtn" class="btn ghost">Call Now</a>
      </div>
      <p id="pDesc" style="margin-top:18px;white-space:pre-line"></p>
    </div>
  </section>

  <section class="sec"><h3>Features</h3><ul class="feat" id="featList"></ul></section>
  <section class="sec"><h3>Specifications</h3><table id="specTable"></table></section>
  <section class="sec info">
    <div><h3>Delivery</h3><p id="delivery" style="white-space:pre-line;margin:0"></p></div>
    <div><h3>Warranty &amp; Returns</h3><p id="warranty" style="white-space:pre-line;margin:0"></p></div>
  </section>
  <section class="sec"><h3>Contact &amp; Shop Address</h3><p id="contact" style="white-space:pre-line;margin:0"></p></section>
</div>

<footer>
  <div id="footerText"></div>
  <div style="margin-top:8px"><a id="ownerLink">Owner login</a></div>
</footer>

<!-- Owner panel -->
<div id="adminModal"><div class="panel" id="panel"></div></div>
<div class="toast" id="toast"></div>

<script id="seed" type="application/json">
{"updated":1,
"password":"admin123",
"shopName":"My Earphone Shop",
"city":"India",
"banner":"Festival offer: Free delivery on orders above ₹499!",
"shopOpen":true,
"accent":"#1f6feb",
"name":"Chrome Wired Earphone",
"tagline":"Mirror-finish metal earphones with deep bass and a built-in mic",
"price":299,
"mrp":599,
"stock":25,
"lowAt":5,
"showExact":true,
"image":"",
"description":"Stylish chrome-finish wired earphones built for everyday listening. Punchy bass, clear vocals and a tangle-resistant cable make them perfect for music, calls and gaming.",
"features":"Premium chrome metal finish\nDeep bass with clear vocals\nBuilt-in microphone for calls\nOne-button music and call control\nTangle-resistant flat cable\nSoft silicone ear tips (3 sizes included)\nWorks with all phones, tablets and laptops with 3.5mm jack",
"specs":"Type: In-ear wired earphones\nConnector: 3.5mm gold-plated jack\nDriver size: 10 mm\nImpedance: 32 Ω\nCable length: 1.2 m\nColor: Chrome / Silver\nIn the box: Earphones, 3 pairs of ear tips, carry pouch",
"delivery":"Delivery across India in 3-7 working days.\nCash on Delivery available.",
"warranty":"6 months replacement warranty on manufacturing defects.\n7-day easy return if unused and in original packing.",
"phone":"9999999999",
"whatsapp":"9999999999",
"address":"Shop No. 1, Main Market, Your City",
"hours":"Open 10 AM - 9 PM, Monday to Saturday",
"orderMsg":"Hello, I want to order",
"footer":"© My Earphone Shop. All rights reserved."}
</script>

<script>
(function(){
var KEY='chromeEarphoneShop_v1';
var seed=JSON.parse(document.getElementById('seed').textContent);
var data=load();
var qty=1;
var $=function(id){return document.getElementById(id)};

function load(){
  var local=null;
  try{local=JSON.parse(localStorage.getItem(KEY)||'null')}catch(e){}
  return (local&&local.updated>seed.updated)?local:JSON.parse(JSON.stringify(seed));
}
function persist(){
  data.updated=Date.now();
  try{localStorage.setItem(KEY,JSON.stringify(data))}catch(e){toast('Could not save (image too large?)')}
}
function toast(t){var el=$('toast');el.textContent=t;el.style.display='block';setTimeout(function(){el.style.display='none'},2600)}
function lines(s){return String(s||'').split('\n').map(function(x){return x.trim()}).filter(Boolean)}
function inr(n){return '₹'+Number(n||0).toLocaleString('en-IN')}
function waNumber(n){var d=String(n||'').replace(/\D/g,'');return d.length===10?'91'+d:d}

var PLACEHOLDER='data:image/svg+xml;utf8,'+encodeURIComponent(
'<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400"><defs><linearGradient id="c" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#fafafa"/><stop offset=".5" stop-color="#9aa4b1"/><stop offset="1" stop-color="#e5e9ee"/></linearGradient></defs>'+
'<rect width="400" height="400" fill="#eef1f5"/>'+
'<path d="M120 90 C120 250 150 300 200 330 C250 360 290 330 290 270" fill="none" stroke="#3b4350" stroke-width="5"/>'+
'<path d="M280 90 C280 200 250 240 200 250" fill="none" stroke="#3b4350" stroke-width="5"/>'+
'<ellipse cx="120" cy="75" rx="26" ry="32" fill="url(#c)" stroke="#4b5563" stroke-width="3"/>'+
'<ellipse cx="280" cy="75" rx="26" ry="32" fill="url(#c)" stroke="#4b5563" stroke-width="3"/>'+
'<rect x="283" y="262" width="14" height="70" rx="5" fill="url(#c)" stroke="#4b5563" stroke-width="3"/></svg>');

function stockInfo(){
  var s=Number(data.stock)||0;
  if(s<=0)return{cls:'out',txt:'Out of stock'};
  if(s<=Number(data.lowAt))return{cls:'low',txt:data.showExact?('Only '+s+' left - hurry!'):'Few left - hurry!'};
  return{cls:'in',txt:data.showExact?('In stock ('+s+' available)'):'In stock'};
}

function render(){
  document.documentElement.style.setProperty('--accent',data.accent||'#1f6feb');
  document.title=data.name+' | '+data.shopName;
  $('shopName').textContent=data.shopName;
  $('shopCity').textContent=data.city||'';
  var b=$('banner');b.style.display=data.banner?'block':'none';b.textContent=data.banner||'';
  $('closedMsg').innerHTML=data.shopOpen?'':'<div class="closed">Orders are temporarily closed. Please check back soon.</div>';
  $('pImg').src=data.image||PLACEHOLDER;
  $('pName').textContent=data.name;
  $('pTag').textContent=data.tagline;
  $('pPrice').textContent=inr(data.price);
  var hasMrp=Number(data.mrp)>Number(data.price);
  $('pMrp').textContent=hasMrp?inr(data.mrp):'';
  $('pOff').textContent=hasMrp?Math.round((1-data.price/data.mrp)*100)+'% off':'';
  var si=stockInfo();var sb=$('stockBadge');sb.className='badge '+si.cls;sb.textContent=si.txt;
  $('pDesc').textContent=data.description;
  $('featList').innerHTML='';
  lines(data.features).forEach(function(f){var li=document.createElement('li');li.textContent=f;$('featList').appendChild(li)});
  $('specTable').innerHTML='';
  lines(data.specs).forEach(function(l){
    var i=l.indexOf(':');var k=i>-1?l.slice(0,i):l;var v=i>-1?l.slice(i+1):'';
    var tr=document.createElement('tr');var a=document.createElement('td');var c=document.createElement('td');
    a.textContent=k.trim();c.textContent=v.trim();tr.appendChild(a);tr.appendChild(c);$('specTable').appendChild(tr);
  });
  $('delivery').textContent=data.delivery;
  $('warranty').textContent=data.warranty;
  $('contact').textContent=data.address+'\nPhone: '+data.phone+'\n'+data.hours;
  $('footerText').textContent=data.footer;
  var max=Math.max(1,Number(data.stock)||1);if(qty>max)qty=max;
  $('qtyVal').textContent=qty;
  var canOrder=data.shopOpen&&Number(data.stock)>0;
  var ob=$('orderBtn');
  if(canOrder){
    var total=qty*data.price;
    var msg=data.orderMsg+' '+qty+' x '+data.name+' (Total '+inr(total)+').';
    ob.href='https://wa.me/'+waNumber(data.whatsapp)+'?text='+encodeURIComponent(msg);
    ob.removeAttribute('disabled');ob.style.pointerEvents='';ob.style.opacity='';
    ob.textContent='Order on WhatsApp - '+inr(total);
  }else{
    ob.removeAttribute('href');ob.style.pointerEvents='none';ob.style.opacity='.5';
    ob.textContent=data.shopOpen?'Out of stock':'Orders closed';
  }
  $('callBtn').href='tel:+'+waNumber(data.phone);
}

$('minus').onclick=function(){if(qty>1){qty--;render()}};
$('plus').onclick=function(){if(qty<(Number(data.stock)||0)){qty++;render()}};

/* ---------- Owner panel ---------- */
var FIELDS=[
 {g:'Product'},
 {k:'name',l:'Product name',t:'text'},
 {k:'tagline',l:'Tagline',t:'text'},
 {k:'price',l:'Selling price (₹)',t:'number'},
 {k:'mrp',l:'MRP / original price (₹)',t:'number',h:'Shown cut-off with discount % if higher than selling price'},
 {k:'description',l:'Description',t:'area'},
 {k:'features',l:'Features',t:'area',h:'One feature per line'},
 {k:'specs',l:'Specifications',t:'area',h:'One per line, as  Name: Value'},
 {g:'Stock'},
 {k:'stock',l:'Stock left (pieces)',t:'number',stock:true},
 {k:'lowAt',l:'Show "hurry" warning when stock is at or below',t:'number'},
 {k:'showExact',l:'Show exact stock number to customers',t:'check'},
 {k:'shopOpen',l:'Accept orders (untick to pause the shop)',t:'check'},
 {g:'Shop & contact'},
 {k:'shopName',l:'Shop name',t:'text'},
 {k:'city',l:'City / tagline in header',t:'text'},
 {k:'banner',l:'Top announcement banner (leave empty to hide)',t:'text'},
 {k:'phone',l:'Phone number',t:'text'},
 {k:'whatsapp',l:'WhatsApp number for orders',t:'text',h:'10-digit number, or with country code'},
 {k:'address',l:'Shop address',t:'area'},
 {k:'hours',l:'Opening hours',t:'text'},
 {k:'orderMsg',l:'Start of WhatsApp order message',t:'text'},
 {g:'Delivery & policies'},
 {k:'delivery',l:'Delivery info',t:'area'},
 {k:'warranty',l:'Warranty & returns',t:'area'},
 {k:'footer',l:'Footer text',t:'text'},
 {g:'Look'},
 {k:'accent',l:'Theme color',t:'color'}
];

function openAdmin(){
  $('adminModal').classList.add('open');
  var p=$('panel');p.innerHTML='';
  var h=document.createElement('h3');h.textContent='Owner login';p.appendChild(h);
  var l=document.createElement('label');l.textContent='Password';p.appendChild(l);
  var inp=document.createElement('input');inp.type='password';inp.placeholder='Enter owner password';p.appendChild(inp);
  var go=document.createElement('button');go.className='btn';go.style.marginTop='14px';go.textContent='Login';p.appendChild(go);
  var cl=document.createElement('button');cl.className='btn ghost';cl.style.cssText='margin:14px 0 0 8px';cl.textContent='Cancel';p.appendChild(cl);
  var n=document.createElement('div');n.className='note';n.textContent='Default password is admin123. Change it after logging in.';p.appendChild(n);
  function tryLogin(){if(inp.value===data.password)buildForm();else toast('Wrong password')}
  go.onclick=tryLogin;inp.onkeydown=function(e){if(e.key==='Enter')tryLogin()};
  cl.onclick=closeAdmin;
}
function closeAdmin(){$('adminModal').classList.remove('open');$('panel').innerHTML=''}

function buildForm(){
  var p=$('panel');p.innerHTML='';
  var h=document.createElement('h3');h.innerHTML='<span>Owner Panel</span>';
  var x=document.createElement('button');x.className='btn ghost';x.textContent='Close';x.style.padding='6px 12px';x.onclick=closeAdmin;h.appendChild(x);p.appendChild(h);
  var note=document.createElement('div');note.className='note';
  note.innerHTML='<b>Important:</b> Changes you save are stored in <i>this browser only</i>. To show them to all customers, click <b>Download updated website</b> and upload that file to your hosting (e.g. Netlify Drop) again.';
  p.appendChild(note);
  var inputs={};
  var grp=null;
  FIELDS.forEach(function(f){
    if(f.g){grp=document.createElement('div');grp.className='grp';var t=document.createElement('h4');t.textContent=f.g;grp.appendChild(t);p.appendChild(grp);
      if(f.g==='Product'){imageField(grp)}
      return}
    var lab=document.createElement('label');lab.textContent=f.l;
    var el;
    if(f.t==='area'){el=document.createElement('textarea');el.value=data[f.k]||''}
    else if(f.t==='check'){el=document.createElement('input');el.type='checkbox';el.checked=!!data[f.k];lab.style.display='flex';lab.style.gap='8px';lab.style.alignItems='center';lab.textContent='';lab.appendChild(el);lab.appendChild(document.createTextNode(f.l))}
    else{el=document.createElement('input');el.type=f.t==='number'?'number':(f.t==='color'?'color':'text');el.value=data[f.k]==null?'':data[f.k];if(f.t==='color'){el.style.height='40px'}}
    inputs[f.k]=el;
    grp.appendChild(lab);
    if(f.t!=='check')grp.appendChild(el);
    if(f.h){var s=document.createElement('small');s.textContent=f.h;grp.appendChild(s)}
    if(f.stock){
      var sb=document.createElement('div');sb.className='stockbtns';
      [['Sold 1',-1],['Sold 5',-5],['Add 10',10],['Add 50',50]].forEach(function(b){
        var bt=document.createElement('button');bt.type='button';bt.textContent=b[0];
        bt.onclick=function(){el.value=Math.max(0,(Number(el.value)||0)+b[1])};sb.appendChild(bt)});
      grp.appendChild(sb);
    }
  });
  var sec=document.createElement('div');sec.className='grp';var st=document.createElement('h4');st.textContent='Owner password';sec.appendChild(st);
  var pl=document.createElement('label');pl.textContent='Change password';sec.appendChild(pl);
  var pw=document.createElement('input');pw.type='text';pw.value=data.password;sec.appendChild(pw);
  var ps=document.createElement('small');ps.textContent='This is only a basic lock. Anyone who knows how to view page source can find it, so do not reuse a password from anywhere important.';sec.appendChild(ps);
  p.appendChild(sec);

  var bar=document.createElement('div');bar.className='sticky';
  function mk(txt,cls,fn){var b=document.createElement('button');b.className='btn '+cls;b.textContent=txt;b.style.padding='10px 14px';b.style.fontSize='14px';b.onclick=fn;bar.appendChild(b)}
  mk('Save changes','',function(){collect();persist();render();toast('Saved on this device')});
  mk('Download updated website','wa',function(){collect();persist();render();download()});
  mk('Reset to original','ghost',function(){if(confirm('Discard all saved changes on this browser?')){localStorage.removeItem(KEY);data=JSON.parse(JSON.stringify(seed));render();buildForm();toast('Reset done')}});
  p.appendChild(bar);

  function collect(){
    FIELDS.forEach(function(f){
      if(!f.k)return;var el=inputs[f.k];
      if(f.t==='check')data[f.k]=el.checked;
      else if(f.t==='number')data[f.k]=Number(el.value)||0;
      else data[f.k]=el.value;
    });
    data.password=pw.value||data.password;
  }
}

function imageField(parent){
  var lab=document.createElement('label');lab.textContent='Product photo';parent.appendChild(lab);
  var f=document.createElement('input');f.type='file';f.accept='image/*';parent.appendChild(f);
  var s=document.createElement('small');s.textContent='Photo is resized automatically. Use "Download updated website" afterwards so everyone sees it.';parent.appendChild(s);
  var rm=document.createElement('button');rm.type='button';rm.textContent='Remove photo';rm.style.cssText='margin-top:6px;padding:6px 10px;border-radius:8px;border:1px solid #cbd5e1;background:#f8fafc;cursor:pointer';
  rm.onclick=function(){data.image='';persist();render();toast('Photo removed')};parent.appendChild(rm);
  f.onchange=function(){
    var file=f.files[0];if(!file)return;
    var r=new FileReader();
    r.onload=function(){
      var im=new Image();
      im.onload=function(){
        var M=900,sc=Math.min(1,M/Math.max(im.width,im.height));
        var c=document.createElement('canvas');c.width=Math.round(im.width*sc);c.height=Math.round(im.height*sc);
        c.getContext('2d').drawImage(im,0,0,c.width,c.height);
        data.image=c.toDataURL('image/jpeg',0.8);persist();render();toast('Photo updated');
      };
      im.src=r.result;
    };
    r.readAsDataURL(file);
  };
}

function download(){
  var clone=document.documentElement.cloneNode(true);
  var sd=clone.querySelector('#seed');
  sd.textContent=JSON.stringify(data).replace(/</g,'\\u003c');
  var m=clone.querySelector('#adminModal');m.classList.remove('open');
  clone.querySelector('#panel').innerHTML='';
  var t=clone.querySelector('#toast');t.style.display='none';
  var html='<!DOCTYPE html>\n'+clone.outerHTML;
  var blob=new Blob([html],{type:'text/html'});
  var a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='index.html';
  document.body.appendChild(a);a.click();a.remove();
  toast('Downloaded as index.html - upload this to your hosting');
}

$('ownerLink').onclick=openAdmin;
render();
})();
</script>
</body>
</html>
